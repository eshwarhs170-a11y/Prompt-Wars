<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Shield Primary Cyber Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shield Core Inner Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glowing Checkmark / Emblem Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container with Subtle Cyber Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#shieldGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Shield Outer Geometry -->
  <path d="M 32 10 L 48 16 C 48 31 41 44 32 50 C 23 44 16 31 16 16 Z" 
        fill="url(#coreGrad)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#cyberGlow)" />

  <!-- Inner Defense Core Shield -->
  <path d="M 32 14.5 L 44 19.5 C 44 31 38.5 41.5 32 46 C 25.5 41.5 20 31 20 19.5 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="1" 
        stroke-opacity="0.4" 
        stroke-dasharray="2 2" />

  <!-- Verification Checkmark / Core Integrity Emblem -->
  <path d="M 26 31.5 L 30.5 36 L 39 25" 
        fill="none" 
        stroke="url(#checkGrad)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#cyberGlow)" />

  <!-- Cyber Node Accents -->
  <circle cx="32" cy="10" r="1.5" fill="#38bdf8" />
  <circle cx="16" cy="16" r="1.5" fill="#6366f1" />
  <circle cx="48" cy="16" r="1.5" fill="#6366f1" />
  <circle cx="32" cy="50" r="1.5" fill="#a855f7" />
</svg>